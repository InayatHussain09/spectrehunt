[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehunt"
version = "5.1.0"
description = "LFI / RFI / RCE / Path Traversal / Command Injection framework"
authors = [{ name = "Inayat Hussain" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0", "beautifulsoup4>=4.12.0"]

[project.optional-dependencies]
render = ["playwright>=1.40.0"]

[project.scripts]
spectrehunt = "main:main"

[tool.setuptools]
packages = ["core", "utils", "payloads"]
py-modules = ["main", "config"]
